<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept Atlas</title>
  <meta name="description" content="Every first-principles explanation behind the interactive math problems, and how they connect.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../math.css">
  <link rel="stylesheet" href="why.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <style>
    .atlas { list-style: none; padding: 0; border-top: 1px solid var(--line); }
    .atlas li { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
    .atlas .kind { color: var(--muted); font-size: 0.8rem; }
    .atlas button { padding: 0.45rem 0.85rem; font-size: 0.85rem; }
    .atlas-section h2 { margin-top: 2rem; }
  </style>
</head>
<body>
  <main class="page">
    <nav class="crumbs"><a href="../../">on inspire</a> / <a href="../">Cool math problems</a> / Concept atlas</nav>
    <h1>Concept atlas</h1>
    <p class="lede">Every explanation behind the "Why?" buttons, from the questions on each page down to the starting points everything rests on.</p>
    <div id="atlas"></div>
  </main>
  <script src="concepts.js"></script>
  <script src="widgets.js"></script>
  <script src="why.js"></script>
  <script>
    (function () {
      const all = window.CONCEPTS || [];
      const sections = [
        ["Questions on the pages", (c) => c.entry],
        ["Ideas", (c) => !c.entry && !c.foundation],
        ["Starting points", (c) => c.foundation],
      ];
      const root = document.getElementById("atlas");
      for (const [heading, pick] of sections) {
        const items = all.filter(pick);
        if (!items.length) continue;
        const sec = document.createElement("section");
        sec.className = "atlas-section";
        sec.innerHTML = `<h2>${heading}</h2><ul class="atlas"></ul>`;
        const ul = sec.querySelector("ul");
        for (const c of items) {
          const li = document.createElement("li");
          li.dataset.whyHost = "";
          li.innerHTML = `<div><div>${c.title}</div><div class="kind">${c.id}</div></div>`;
          const b = document.createElement("button");
          b.type = "button";
          b.dataset.open = c.id;
          b.textContent = "Open";
          b.addEventListener("click", () => Why.open(c.id, {}, b));
          li.append(b);
          ul.append(li);
        }
        root.append(sec);
      }
    })();
  </script>
</body>
</html>
