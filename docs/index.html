<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On Inspire</title>
  <meta name="description" content="Travel the On Inspire network — math, cooking, writing, and a thesis in progress.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #061018;
      --paper: #f3ead6;
      --muted: #9aa7a3;
      --gold: #d4b06a;
      --aurora: #4ea8a0;
      --ember: #c45c4a;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--void);
      color: var(--paper);
      font: 400 1rem/1.45 Figtree, system-ui, sans-serif;
      overflow: hidden;
    }
    #field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.09;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .chrome {
      position: fixed; z-index: 3; left: 1.25rem; top: 1.1rem;
      display: grid; gap: 0.2rem; max-width: 16rem; pointer-events: none;
    }
    .chrome h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .chrome p { color: var(--muted); font-size: 0.92rem; }
    #graph {
      position: fixed; inset: 0; z-index: 2; width: 100%; height: 100%;
      touch-action: manipulation;
      pointer-events: none;
    }
    .orbit { pointer-events: none; }
    .edge { pointer-events: none; }
    .node { pointer-events: auto; cursor: pointer; }
    .edge { fill: none; stroke: var(--aurora); stroke-width: 1.15; opacity: 0.35; }
    .edge.is-dim { opacity: 0.08; }
    .edge.is-live { opacity: 0.7; stroke-width: 1.6; }
    .node:focus-visible { outline: none; }
    .node:focus-visible .halo { opacity: 1; }
    .halo {
      fill: none; stroke: var(--gold); stroke-width: 1.2; opacity: 0;
      transition: opacity 0.2s ease;
    }
    .hit { fill: transparent; }
    .node:hover .halo { opacity: 0.85; }
    .core { fill: var(--gold); }
    .core.inspire { fill: var(--paper); }
    .core.leaf { fill: var(--aurora); }
    .ring { fill: none; stroke: var(--paper); stroke-width: 1; opacity: 0.28; }
    .label {
      fill: var(--paper);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      text-anchor: middle;
      pointer-events: none;
    }
    .label.inspire { font-size: 28px; font-style: italic; }
    .label.leaf { font-size: 14px; fill: var(--muted); font-family: Figtree, system-ui, sans-serif; }
    .label.leaf.linked { fill: var(--paper); }
    .node:hover .label.linked, .node:focus-visible .label.linked { fill: var(--gold); }
    .node.is-dim { opacity: 0.16; }
    .node.is-dim { pointer-events: none; }
    .orbit { fill: none; stroke: rgba(243, 234, 214, 0.08); stroke-width: 1; }
    .dock {
      position: fixed; z-index: 3; left: 50%; bottom: 1.4rem;
      translate: -50% 0;
      display: flex; gap: 0.6rem; align-items: center;
      pointer-events: auto;
    }
    button {
      appearance: none; border: 1px solid rgba(243, 234, 214, 0.22);
      background: rgba(6, 16, 24, 0.72);
      color: var(--paper);
      font: 500 0.9rem/1 Figtree, system-ui, sans-serif;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover, button:focus-visible {
      border-color: var(--gold);
      outline: none;
    }
    button[hidden] { display: none; }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .hint { color: var(--muted); font-size: 0.8rem; }
    @media (prefers-reduced-motion: reduce) {
      .halo { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <header class="chrome">
    <h1>On Inspire</h1>
    <p>Pick a star. The map will fold toward it.</p>
  </header>
  <div id="status" role="status" aria-live="polite"></div>
  <svg id="graph" role="img" aria-label="On Inspire network">
    <circle class="orbit" cx="0" cy="0" r="220" />
    <g id="world"></g>
  </svg>
  <div class="dock">
    <button id="back" type="button" hidden>Back to on inspire</button>
    <span class="hint" id="hint">Click a node, or use the keyboard</span>
  </div>

  <script>
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const graph = document.getElementById("graph");
    const world = document.getElementById("world");
    const back = document.getElementById("back");
    const hint = document.getElementById("hint");
    const status = document.getElementById("status");

    const HUBS = [
      {
        id: "math",
        label: "Cool Math Problems",
        angle: -0.95,
        children: [
          { label: "Build a square wave", href: "math/square-wave/" },
          { label: "Two cups of tea", href: "math/two-cups/" },
          { label: "Integration by parts", href: "math/integration-by-parts/" },
          { label: "All math problems", href: "math/" },
        ],
      },
      {
        id: "cooking",
        label: "Cooking Videos",
        angle: 0.35,
        children: ["Knife and flame", "A week of soups", "Pantry geometry", "Night baking", "One pot, two moods"],
      },
      {
        id: "blog",
        label: "Blog",
        angle: 2.15,
        children: ["Field notes", "Tools I keep", "What I unlearned", "Slow builds", "Letters to later"],
      },
      {
        id: "thesis",
        label: "Honors Thesis",
        angle: 3.45,
        children: ["Abstract", "Chapter one", "Methods", "Figures", "Defense notes"],
      },
    ];

    const ROOT = 220;
    const LEAF = 158;
    const inspire = { id: "inspire", label: "on inspire", x: 0, y: 0, kind: "inspire" };
    const hubs = HUBS.map((h) => ({
      ...h,
      x: Math.cos(h.angle) * ROOT,
      y: Math.sin(h.angle) * ROOT,
      kind: "hub",
    }));

    const leavesOf = (hub) => {
      const n = hub.children.length;
      const spread = 1.45;
      return hub.children.map((child, i) => {
        const { label, href } = typeof child === "string" ? { label: child } : child;
        const a = n === 1 ? hub.angle : hub.angle - spread / 2 + (spread * i) / (n - 1);
        return {
          id: `${hub.id}-${i}`,
          label,
          href,
          parent: hub.id,
          angle: a,
          x: hub.x + Math.cos(a) * LEAF,
          y: hub.y + Math.sin(a) * LEAF,
          kind: "leaf",
        };
      });
    };

    let focus = "inspire";
    let cam = { x: 0, y: 0, k: 1 };
    let target = { x: 0, y: 0, k: 1 };
    let w = innerWidth;
    let h = innerHeight;

    const ns = "http://www.w3.org/2000/svg";
    const el = (name, attrs = {}) => {
      const node = document.createElementNS(ns, name);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      return node;
    };

    const setCam = (next, instant) => {
      target = next;
      if (instant || reduce) cam = { ...next };
    };

    const fitRoot = () => {
      const pad = 90;
      const k = Math.min((w - pad) / 560, (h - pad) / 560, 1.15);
      setCam({ x: 0, y: 0, k: Math.max(k, 0.55) }, cam.k === 1 && cam.x === 0);
    };

    // Fit the hub, its leaves and their labels between the header and the dock
    const zoomTo = (node) => {
      const box = [Infinity, Infinity, -Infinity, -Infinity];
      const add = (x0, y0, x1, y1) => {
        box[0] = Math.min(box[0], x0); box[1] = Math.min(box[1], y0);
        box[2] = Math.max(box[2], x1); box[3] = Math.max(box[3], y1);
      };
      const hw = node.label.length * 4.4;
      add(node.x - hw, node.y - 44, node.x + hw, node.y + 14);
      for (const leaf of leavesOf(node)) {
        const ox = Math.cos(leaf.angle);
        const oy = Math.sin(leaf.angle);
        const tw = leaf.label.length * 7.4;
        const lx = leaf.x + ox * 16;
        const ly = leaf.y + oy * 16 + 4;
        const x0 = ox > 0.08 ? lx : ox < -0.08 ? lx - tw : lx - tw / 2;
        add(x0, ly - 15, x0 + tw, ly + 6);
        add(leaf.x - 10, leaf.y - 10, leaf.x + 10, leaf.y + 10);
      }
      const top = 96, bottom = 84, side = 20;
      const k = Math.max(0.5, Math.min((w - 2 * side) / (box[2] - box[0]), (h - top - bottom) / (box[3] - box[1]), 2.6));
      const mid = (top + h - bottom) / 2;
      setCam({ x: (box[0] + box[2]) / 2, y: (box[1] + box[3]) / 2 - (mid - h / 2) / k, k });
    };

    const applyView = () => {
      const tx = w / 2 - cam.x * cam.k;
      const ty = h / 2 - cam.y * cam.k;
      world.setAttribute("transform", `translate(${tx} ${ty}) scale(${cam.k})`);
      graph.querySelector(".orbit").setAttribute("transform", `translate(${tx} ${ty}) scale(${cam.k})`);
    };

    const announce = (msg) => { status.textContent = msg; };

    const draw = () => {
      world.replaceChildren();
      const edges = el("g");
      const nodes = el("g");
      const active = hubs.find((h) => h.id === focus);
      const shownLeaves = active ? leavesOf(active) : [];
      graph.querySelector(".orbit").style.opacity = focus === "inspire" ? "1" : "0";

      for (const hub of hubs) {
        const line = el("line", {
          class: `edge${focus === "inspire" ? "" : hub.id === focus ? " is-live" : " is-dim"}`,
          x1: 0, y1: 0, x2: hub.x, y2: hub.y,
        });
        edges.append(line);
      }
      for (const leaf of shownLeaves) {
        const parent = hubs.find((h) => h.id === leaf.parent);
        edges.append(el("line", {
          class: "edge is-live",
          x1: parent.x, y1: parent.y, x2: leaf.x, y2: leaf.y,
        }));
      }
      world.append(edges);

      const all = [inspire, ...hubs, ...shownLeaves];
      for (const n of all) {
        const g = el("g", {
          class: `node${focus !== "inspire" && n.kind === "hub" && n.id !== focus ? " is-dim" : ""}`,
          tabindex: n.kind === "hub" && focus !== "inspire" && n.id !== focus ? "-1" : "0",
          role: "button",
          "data-id": n.id,
          "data-kind": n.kind,
        });
        g.setAttribute("aria-label", n.kind === "leaf" && !n.href ? `${n.label}, coming soon` : n.label);
        if (n.href) g.setAttribute("role", "link");
        const r = n.kind === "inspire" ? 16 : n.kind === "hub" ? 9 : 5.5;
        g.append(el("circle", { class: "hit", r: n.kind === "leaf" ? 16 : 26, cx: n.x, cy: n.y }));
        g.append(el("circle", { class: "halo", r: r + 10, cx: n.x, cy: n.y }));
        if (n.kind === "inspire") g.append(el("circle", { class: "ring", r: 26, cx: n.x, cy: n.y }));
        g.append(el("circle", { class: `core ${n.kind}`, r, cx: n.x, cy: n.y }));
        const label = el("text", { class: `label ${n.kind}${n.href ? " linked" : ""}` });
        if (n.kind === "leaf") {
          const ox = Math.cos(n.angle);
          const oy = Math.sin(n.angle);
          label.setAttribute("x", n.x + ox * 16);
          label.setAttribute("y", n.y + oy * 16 + 4);
          label.style.textAnchor = ox > 0.08 ? "start" : ox < -0.08 ? "end" : "middle";
        } else {
          label.setAttribute("x", n.x);
          label.setAttribute("y", n.y + (n.kind === "inspire" ? -36 : -22));
        }
        label.textContent = n.label;
        g.append(label);
        g.addEventListener("click", () => select(n));
        g.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(n); }
        });
        nodes.append(g);
      }
      world.append(nodes);
    };

    const select = (n) => {
      if (n.href) {
        location.href = n.href;
        return;
      }
      if (n.kind === "leaf") {
        announce(`${n.label} is a placeholder for later.`);
        hint.textContent = "This branch is a placeholder";
        return;
      }
      if (n.kind === "hub" && n.id === focus) {
        announce(`Already in ${n.label}`);
        return;
      }
      if (n.id === "inspire") {
        focus = "inspire";
        history.replaceState(null, "", location.pathname + location.search);
        fitRoot();
        back.hidden = true;
        hint.textContent = "Click a node, or use the keyboard";
        announce("Returned to on inspire");
      } else {
        focus = n.id;
        history.replaceState(null, "", `#${n.id}`);
        zoomTo(n);
        back.hidden = false;
        hint.textContent = n.label;
        announce(`Opened ${n.label}`);
      }
      draw();
    };

    back.addEventListener("click", () => select(inspire));
    addEventListener("keydown", (e) => {
      if (e.key === "Escape" && focus !== "inspire") select(inspire);
    });

    const fromHash = () => {
      const id = location.hash.replace("#", "");
      const hub = hubs.find((h) => h.id === id);
      if (hub) select(hub);
      else {
        focus = "inspire";
        back.hidden = true;
        fitRoot();
        draw();
      }
    };

    addEventListener("resize", () => {
      w = innerWidth; h = innerHeight;
      graph.setAttribute("viewBox", `0 0 ${w} ${h}`);
      if (focus === "inspire") fitRoot();
      else zoomTo(hubs.find((h) => h.id === focus));
    });

    const tick = () => {
      const ease = reduce ? 1 : 0.1;
      cam.x += (target.x - cam.x) * ease;
      cam.y += (target.y - cam.y) * ease;
      cam.k += (target.k - cam.k) * ease;
      applyView();
      requestAnimationFrame(tick);
    };

    graph.setAttribute("viewBox", `0 0 ${w} ${h}`);
    fromHash();
    applyView();
    tick();

    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    let dots, cw, ch;
    const resizeField = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      cw = canvas.width = innerWidth * dpr;
      ch = canvas.height = innerHeight * dpr;
      const count = Math.round((innerWidth * innerHeight) / 16000);
      dots = Array.from({ length: count }, () => ({
        x: Math.random() * cw,
        y: Math.random() * ch,
        vx: (Math.random() - 0.5) * 0.18 * dpr,
        vy: (Math.random() - 0.5) * 0.18 * dpr,
        r: (Math.random() * 1.2 + 0.3) * dpr,
      }));
    };
    const paint = () => {
      ctx.clearRect(0, 0, cw, ch);
      for (const d of dots) {
        d.x = (d.x + d.vx + cw) % cw;
        d.y = (d.y + d.vy + ch) % ch;
        ctx.fillStyle = "rgba(212,176,106,0.55)";
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (!reduce) requestAnimationFrame(paint);
    };
    addEventListener("resize", resizeField);
    resizeField();
    paint();
  </script>
</body>
</html>
